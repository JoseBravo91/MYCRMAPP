services:
  postgres:
    image: postgres:16-alpine
    container_name: mycrmapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mycrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mycrm_local}
      POSTGRES_DB: ${POSTGRES_DB:-mycrmapp_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
